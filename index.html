<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff6b1a">
  <meta name="description" content="BS Estudos - Sua plataforma de estudos completa">
  <title>BS Estudos</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&family=Literata:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@1.47.0/dist/umd/lucide.min.js"></script>

  <!-- PWA -->
  <link rel="manifest" href="%BASE_URL%manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BS Estudos">
</head>
<body>
  <div id="app"></div>
  <!-- Caminho a partir da raiz do projeto: o Vite resolve o módulo e aplica a
       base na saída. Com %BASE_URL% o Rollup procura /<base>/src/main.js no
       disco e o build quebra sempre que BASE_PATH não é "/". -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
