<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizador de Questões do ENEM</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --background: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --foreground: #f8fafc;
      --muted-foreground: #94a3b8;
      --primary: #3b82f6;
    }
    body {
      background-color: var(--background);
      color: var(--foreground);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>
</head>
<body class="p-4 md:p-8 flex justify-center items-start min-h-screen">
  <div class="max-w-3xl w-full bg-[var(--card)] border border-[var(--border)] rounded-2xl shadow-2xl p-6 md:p-8 space-y-6">
    
    <!-- Header -->
    <div class="flex flex-wrap items-center justify-between gap-4 border-b border-[var(--border)] pb-4">
      <div>
        <span class="text-xs font-semibold tracking-wider uppercase px-2.5 py-1 bg-blue-500/20 text-blue-400 rounded-full border border-blue-500/30">
          ENEM Database Viewer
        </span>
        <h1 class="text-xl md:text-2xl font-bold mt-2 text-white">Visualizador de Questões com Imagem</h1>
      </div>
      
      <!-- Tab Selector -->
      <div class="flex bg-slate-800/80 p-1 rounded-xl border border-slate-700 text-sm">
        <button id="tab-btn-1" onclick="selectQuestion(1)" class="px-3 py-1.5 rounded-lg font-medium transition-all bg-blue-600 text-white shadow-sm">
          Questão 1 (2024 D1)
        </button>
        <button id="tab-btn-2" onclick="selectQuestion(2)" class="px-3 py-1.5 rounded-lg font-medium transition-all text-slate-400 hover:text-white">
          Questão 136 (2024 D2)
        </button>
      </div>
    </div>

    <!-- Question Metadata Banner -->
    <div id="meta-banner" class="flex flex-wrap gap-2 text-xs text-[var(--muted-foreground)]"></div>

    <!-- Image Container -->
    <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-4 flex flex-col items-center justify-center overflow-hidden">
      <img id="question-img" src="" alt="Imagem da Questão" class="max-h-72 object-contain rounded-lg shadow-md border border-slate-700/50 bg-white/5 p-1" />
      <span id="img-caption" class="text-xs text-slate-500 mt-2 font-mono"></span>
    </div>

    <!-- Statement Text -->
    <div class="text-slate-200 text-sm md:text-base leading-relaxed whitespace-pre-line bg-slate-900/40 p-4 rounded-xl border border-slate-800/70" id="statement-text"></div>

    <!-- Alternatives List -->
    <div class="space-y-3" id="alternatives-container"></div>

    <!-- Action & Feedback Bar -->
    <div class="pt-4 border-t border-[var(--border)] flex flex-col sm:flex-row items-center justify-between gap-4">
      <button id="check-btn" onclick="checkAnswer()" class="w-full sm:w-auto px-6 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl transition duration-200 shadow-lg shadow-blue-500/20 active:scale-95">
        Conferir Gabarito
      </button>
      <div id="feedback-msg" class="text-sm font-medium transition-all"></div>
    </div>

  </div>

        imgInfo: "content/enem/assets/2024/dia-2/q136_fig1.png (614 × 541 px)",
        statement: "Uma empresa produz mochilas escolares sob encomenda. Essa empresa tem um custo total de produção, composto por um custo fixo, que não depende do número de mochilas, mais um custo variável, que é proporcional ao número de mochilas produzidas. O custo total cresce de forma linear, e a tabela apresenta esse custo para três quantidades de mochilas produzidas.\n\nO custo total, em real, para a produção de 80 mochilas será",
        options: {
          'A': "2 400,00.",
          'B': "2 520,00.",
          'C': "2 550,00.",
          'D': "2 700,00.",
          'E': "2 800,00."
        },
        correct: "C"
      }
    };

    let currentQ = 1;
    let selectedOption = null;

    function selectQuestion(id) {
      currentQ = id;
      selectedOption = null;
      document.getElementById('feedback-msg').innerHTML = '';
      
      document.getElementById('tab-btn-1').className = id === 1 
        ? 'px-3 py-1.5 rounded-lg font-medium transition-all bg-blue-600 text-white shadow-sm'
        : 'px-3 py-1.5 rounded-lg font-medium transition-all text-slate-400 hover:text-white';
      document.getElementById('tab-btn-2').className = id === 2 
        ? 'px-3 py-1.5 rounded-lg font-medium transition-all bg-blue-600 text-white shadow-sm'
        : 'px-3 py-1.5 rounded-lg font-medium transition-all text-slate-400 hover:text-white';

      renderQuestion();
    }

    function renderQuestion() {
      const q = questions[currentQ];
      
      // Metadata
      document.getElementById('meta-banner').innerHTML = `
        <span class="bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-md text-slate-300 font-mono">Ano: ${q.year}</span>
        <span class="bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-md text-slate-300 font-mono">Dia ${q.day}</span>
        <span class="bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-md text-slate-300 font-mono">Questão ${q.number}</span>
        <span class="bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-md text-indigo-300">${q.area}</span>
        <span class="bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-md text-slate-400">Origem: ${q.pdf}</span>
      `;

      // Image
      document.getElementById('question-img').src = q.img;
      document.getElementById('img-caption').innerText = q.imgInfo;

      // Statement
      document.getElementById('statement-text').innerText = q.statement;

      // Alternatives
      let altHtml = '';
      for (const [letter, text] of Object.entries(q.options)) {
        altHtml += `
          <label id="opt-label-${letter}" class="flex items-start gap-3 p-3.5 rounded-xl border border-slate-800 bg-slate-900/60 hover:bg-slate-800/80 cursor-pointer transition duration-150">
            <input type="radio" name="alternative" value="${letter}" onchange="handleSelect('${letter}')" class="mt-1 text-blue-600 focus:ring-blue-500 bg-slate-800 border-slate-700">
            <div class="flex-1 text-sm text-slate-300 leading-snug">
              <strong class="text-white mr-1.5">${letter})</strong> ${text}
            </div>
          </label>
        `;
      }
      document.getElementById('alternatives-container').innerHTML = altHtml;
    }

    function handleSelect(letter) {
      selectedOption = letter;
      document.getElementById('feedback-msg').innerHTML = '';
      resetBorders();
      const label = document.getElementById(`opt-label-${letter}`);
      if (label) {
        label.classList.add('border-blue-500/80', 'bg-blue-950/20');
      }
    }

    function resetBorders() {
      ['A','B','C','D','E'].forEach(l => {
        const el = document.getElementById(`opt-label-${l}`);
        if (el) {
          el.className = 'flex items-start gap-3 p-3.5 rounded-xl border border-slate-800 bg-slate-900/60 hover:bg-slate-800/80 cursor-pointer transition duration-150';
        }
      });
    }

    function checkAnswer() {
      if (!selectedOption) {
        document.getElementById('feedback-msg').innerHTML = '<span class="text-amber-400 font-medium">⚠️ Selecione uma alternativa primeiro.</span>';
        return;
      }
      const q = questions[currentQ];
      const feedback = document.getElementById('feedback-msg');
      resetBorders();

      const correctLabel = document.getElementById(`opt-label-${q.correct}`);
      if (correctLabel) {
        correctLabel.className = 'flex items-start gap-3 p-3.5 rounded-xl border border-emerald-500 bg-emerald-950/40 text-emerald-300 font-medium transition duration-150';
      }

      if (selectedOption === q.correct) {
        feedback.innerHTML = '<span class="text-emerald-400 font-bold flex items-center gap-1.5">🎉 Correto! Gabarito Oficial: Alternativa ' + q.correct + '</span>';
      } else {
        const wrongLabel = document.getElementById(`opt-label-${selectedOption}`);
        if (wrongLabel) {
          wrongLabel.className = 'flex items-start gap-3 p-3.5 rounded-xl border border-rose-500 bg-rose-950/40 text-rose-300 transition duration-150';
        }
        feedback.innerHTML = '<span class="text-rose-400 font-bold flex items-center gap-1.5">❌ Incorreto. Gabarito Oficial: Letra ' + q.correct + '</span>';
      }
    }

    // Init
    selectQuestion(1);
  </script>
